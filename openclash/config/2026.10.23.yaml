proxy-providers:
  Nexitally:
    type: http
    url: "机场订阅链接"
    path: ./proxy_provider/Nexitally.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    exclude-filter: &ex_filter "(?i)(Expire|Traffic|Reset|GB|G\\s*\\||套餐|到期|重置|剩余|流量|官网|网址|订阅|时间|获取|更新|公告|说明|群|频道|139\\.199\\.\\d+\\.\\d+|超时|异常|0ms|低质量|坏节点|Premium|高倍率|[2-9]\\d*x)"

  WgetCloud:
    type: http
    url: "机场订阅链接"
    path: ./proxy_provider/WgetCloud.yaml
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    exclude-filter: *ex_filter

port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
allow-lan: true
bind-address: '*'
mode: rule
ipv6: false
unified-delay: true
tcp-concurrent: true
tfo: true
find-process-mode: 'off'
log-level: error
disable-keep-alive: false
keep-alive-idle: 60
keep-alive-interval: 15

external-controller: 0.0.0.0:9090
secret: "HC4Z8Bcux69HzeZzcA6t"

lgbm-auto-update: true
lgbm-update-interval: 168
lgbm-url: https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin

profile:
  store-selected: true
  store-fake-ip: true
  smart-collector-size: 100

external-ui: "/usr/share/openclash/ui"
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 168
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

hosts:
  dns.google:
    - 8.8.8.8
    - 8.8.4.4
  cloudflare-dns.com:
    - 1.1.1.1
    - 1.0.0.1
  dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
  doh.pub:
    - 1.12.12.12
    - 120.53.53.53
  openwrt.lan: lan
  immortalwrt.lan: lan
  lede.lan: lan
  router.lan: lan
  OpenWrt.lan: lan

ntp:
  enable: true
  write-to-system: true
  server: time1.cloud.tencent.com
  port: 123
  interval: 30

tun:
  enable: true
  stack: mixed
  device: utun
  mtu: 1500
  gso: true
  gso-max-size: 65536
  dns-hijack:
    - any:53
    - tcp://any:53
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false
  disable-icmp-forwarding: false

sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    QUIC:
      ports:
        - 443
        - 8443
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: false
  force-domain:
    - +.netflix.com
    - +.nflxvideo.net
    - +.amazonaws.com
    - +.media.dssott.com
  skip-domain:
    - "Mijia Cloud"
    - "+.io.mi.com"
    - "dlg.io.mi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"

dns:
  enable: true
  listen: 0.0.0.0:7874
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:geosite-private
    - +.steamserver.net
    - +.cm.steampowered.com
    - localhost
    - '*.localhost'
    - +.lan
    - +.local
    - +.localdomain
    - +.home.arpa
    - +.internal
    - +.msftconnecttest.com
    - +.msftncsi.com
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.apple.com
    - time.*.apple.com
    - time1.cloud.tencent.com
    - +.pool.ntp.org
    - ntp.*.com
    - '*.stun.*.*'
    - '*.stun.*.*.*'
    - lens.l.google.com
  use-system-hosts: false
  use-hosts: true
  prefer-h3: false
  respect-rules: true
  disable-q-type65: true
  fast-reverse-lookup: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  direct-nameserver-follow-policy: true
  nameserver-policy:
    "rule-set:geosite-cn,geosite-private,geosite-apple-cn,geosite-microsoft-cn,geosite-steam-cn":
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
    +.cn:
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
  nameserver:
    - https://dns.google/dns-query#故障转移
    - https://cloudflare-dns.com/dns-query#故障转移

experimental:
  ignore-resolve-fail: true
  quic-go-disable-gso: true

